sentence=Describe firmware state once, serve it as a queryable JSON tree over HTTP, ESP-NOW (NowTP) or serial.
paragraph=Declare values, actions and objects in one line each; TesserAPI handles reading, writing, validation, schema, partial queries (path, depth, keys, sparse shapes) and patches, streaming JSON without building documents. Transport-agnostic, for ESP32 under Arduino and ESP-IDF.
