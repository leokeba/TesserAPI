name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the manifests state one version
        run: python3 scripts/version.py
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v5
      - name: Build on-target test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
      - name: Build on-target test without IPv6
        if: matrix.idf == 'latest'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
          command: idf.py -B build-noipv6 -DSDKCONFIG=build-noipv6/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.noipv6" build
      - name: Build HTTP example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf/http_api

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.3.7"]
        # The examples with Wi-Fi, HTTP and NowTP outgrew the default 1.25 MB
        # app partition (HttpAndNowTP on the C3 by 5.6 KB): build them as
        # applications that size would, with a larger one.
        fqbn: ["esp32:esp32:esp32:PartitionScheme=min_spiffs", "esp32:esp32:esp32c3:PartitionScheme=min_spiffs"]
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino
          libraries: |
            - source-path: ./
            - name: ArduinoJson
            - source-url: https://github.com/leokeba/NowTP.git

  # Each push to main that passes becomes a release (DESIGN.md §16): a patch
  # bump unless a commit since the last tag has a "Release: minor" or
  # "Release: major" trailer. The manifests are stamped on a commit only the
  # tag points at; main gets none.
  release:
    needs: [host-tests, esp-idf, arduino]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      version-command: jq -r .version library.json
      stamp-command: python3 scripts/version.py "$VERSION"
