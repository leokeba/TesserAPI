name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the manifests state one version
        run: python3 scripts/version.py
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # size_t is 32 bits on the ESP32: a wrap or truncation of a wire length is
  # invisible in a 64-bit host build, so run the same suite with -m32.
  host-tests-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the 32-bit toolchain (multilib)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: Build and run tests (ASan + UBSan, 32-bit size_t)
        run: |
          cmake -S . -B build-m32 -DCMAKE_CXX_FLAGS=-m32
          cmake --build build-m32 -j
          ctest --test-dir build-m32 --output-on-failure

  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [release-v5.1, release-v5.4, release-v5.5, latest]
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v5
      - name: Build on-target test
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
      - name: Build on-target test without IPv6
        if: matrix.idf == 'latest'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: test/hardware
          command: idf.py -B build-noipv6 -DSDKCONFIG=build-noipv6/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.noipv6" build
      - name: Build HTTP example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/idf/http_api

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["3.3.7"]
        # The examples with Wi-Fi, HTTP and NowTP outgrew the default 1.25 MB
        # app partition (HttpAndNowTP on the C3 by 5.6 KB): build them as
        # applications that size would, with a larger one.
        fqbn: ["esp32:esp32:esp32:PartitionScheme=min_spiffs", "esp32:esp32:esp32c3:PartitionScheme=min_spiffs"]
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: examples/arduino
          libraries: |
            - source-path: ./
            - name: ArduinoJson
            - source-url: https://github.com/leokeba/NowTP.git

  # A harness that stops building, or a shallow crash, shows up on push:
  # each is run for 60 s on the seeds (test/fuzz/README.md).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the libFuzzer harnesses (clang, ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -DTESSER_FUZZ=ON -DTESSER_BUILD_TESTS=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-O1
          cmake --build build-fuzz -j
      - name: Run each harness for 60 s on the seeds
        run: |
          python3 test/fuzz/seeds.py build-fuzz/seeds
          for bin in build-fuzz/test/fuzz/fuzz_*; do
            h=${bin##*/fuzz_}
            mkdir -p build-fuzz/corpus/$h
            $bin -max_len=4096 -max_total_time=60 build-fuzz/corpus/$h build-fuzz/seeds/$h
          done

  # Each push to main that passes becomes a release (DESIGN.md §16): a patch
  # bump unless a commit since the last tag has a "Release: minor" or
  # "Release: major" trailer. The manifests are stamped on a commit only the
  # tag points at; main gets none.
  release:
    needs: [host-tests, host-tests-32bit, esp-idf, arduino, fuzz-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      version-command: jq -r .version library.json
      stamp-command: python3 scripts/version.py "$VERSION"
